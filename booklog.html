<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booklog | perlgray</title>
  <meta name="description" content="Jacqueline Song's reading records." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Special+Elite&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: "Season Serif";
      src: url("assets/fonts/SeasonSerif-TRIAL-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Season Serif";
      src: url("assets/fonts/SeasonSerif-TRIAL-RegularItalic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --desk: #09090a;
      --paper: #ccc2bc;
      --graphite: #26282b;
      --graphite-soft: rgba(38, 40, 43, 0.62);
      --graphite-faint: rgba(38, 40, 43, 0.18);
      --amethyst: #3B003E;
      --lime: #E0FF17;
      --on-dark: #d9dbdd;
      --on-dark-dim: rgba(217, 219, 221, 0.55);
      --on-dark-faint: rgba(217, 219, 221, 0.22);
      --hairline: rgba(217, 219, 221, 0.1);

      --font-serif: "Season Serif", "Times New Roman", serif;
      --font-hand: "Cedarville Cursive", cursive;
      --font-type: "Special Elite", "Courier New", monospace;
      --font-ui: "Inter", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--desk); }

    body {
      background:
        radial-gradient(ellipse 55% 45% at 50% 110%, rgba(59, 0, 62, 0.42), transparent 70%) fixed,
        radial-gradient(ellipse 70% 55% at 50% 30%, #25272a 0%, #131416 48%, var(--desk) 100%) fixed,
        var(--desk);
      color: var(--on-dark);
      font-family: var(--font-ui);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    ::selection { background: var(--lime); color: var(--amethyst); }
    :focus-visible { outline: 1px solid var(--lime); outline-offset: 3px; }

    /* ---------- film fx overlay (same as the homepage) ---------- */
    .sb-fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
    .sb-fx .grain {
      position: absolute;
      inset: -50%;
      opacity: 0.11;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grain 0.9s steps(5) infinite;
    }
    @keyframes grain {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-4%, 3%); }
      40% { transform: translate(3%, -2%); }
      60% { transform: translate(-2%, -4%); }
      80% { transform: translate(4%, 2%); }
      100% { transform: translate(0, 0); }
    }
    .sb-fx .flicker {
      position: absolute;
      inset: 0;
      background: rgba(225, 232, 240, 0.025);
      animation: flicker 5s steps(1) infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      12% { opacity: 0.4; }
      13% { opacity: 1; }
      47% { opacity: 0.7; }
      48% { opacity: 1; }
      71% { opacity: 0.3; }
      72% { opacity: 1; }
    }
    .sb-fx .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    /* ---------- header ---------- */
    .sb-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 1.4rem clamp(1rem, 4vw, 3rem) 1.1rem;
    }
    .sb-logo {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      text-decoration: none;
    }
    .sb-nav { display: flex; gap: clamp(0.9rem, 2.4vw, 2rem); flex-wrap: wrap; justify-content: flex-end; }
    .sb-nav a {
      font-family: var(--font-type);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--on-dark-dim);
      transition: color 0.3s ease;
    }
    .sb-nav a:hover { color: var(--lime); }
    .sb-nav a[aria-current="page"] { color: var(--lime); }

    /* ---------- the ledger sheet ---------- */
    .bl-desk { padding: clamp(1.5rem, 4vw, 3rem) 16px clamp(3rem, 7vw, 5rem); }

    .bl-sheet {
      position: relative;
      container-type: inline-size;
      max-width: 62rem;
      margin: 0 auto;
      padding: clamp(1.4rem, 4vw, 2.8rem) clamp(1rem, 4vw, 3rem) clamp(1.6rem, 4vw, 2.6rem) clamp(2.4rem, 7vw, 5rem);
      color: var(--graphite);
      border-radius: 3px;
      background:
        radial-gradient(circle at 18% 8%, rgba(96, 102, 110, 0.10), transparent 32%),
        radial-gradient(circle at 84% 92%, rgba(96, 102, 110, 0.12), transparent 38%),
        radial-gradient(circle at 60% 40%, rgba(250, 248, 246, 0.16), transparent 60%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.38  0 0 0 0 0.41  0 0 0 0.15 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
        var(--paper);
      box-shadow:
        0 1px 0 #c4c6c7, 0 2px 0 #9a9da0, 0 3px 0 #bfc1c3, 0 4px 0 #8e9195, 0 5px 0 #b7babc,
        0 34px 70px rgba(0, 0, 0, 0.7), 0 12px 24px rgba(0, 0, 0, 0.5);
    }
    .bl-sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 0 70px rgba(70, 75, 82, 0.3);
    }
    /* ledger margin rule, in amethyst ink */
    .bl-sheet::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: clamp(1.8rem, 5.6vw, 4.2rem);
      width: 4px;
      border-left: 1px solid rgba(59, 0, 62, 0.32);
      border-right: 1px solid rgba(59, 0, 62, 0.32);
      pointer-events: none;
    }

    .typed {
      font-family: var(--font-type);
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--graphite-soft);
      line-height: 1.6;
    }
    .note {
      font-family: var(--font-hand);
      font-size: 1.05rem;
      line-height: 1.35;
      color: var(--graphite);
      transform: rotate(var(--r, -1deg));
    }
    .note a { color: var(--amethyst); text-decoration: none; border-bottom: 1px solid rgba(59, 0, 62, 0.4); transition: background-color 0.3s ease; }
    .note a:hover { border-bottom-color: var(--amethyst); background-color: rgba(224, 255, 23, 0.55); }


    .bl-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.4rem 2rem;
      flex-wrap: wrap;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--graphite-faint);
    }
    .bl-head > div { display: flex; flex-direction: column; gap: 0.2rem; }
    .bl-head h1 {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2.2rem, 5.5vw, 3.4rem);
      line-height: 0.95;
    }

    .bl-table { width: 100%; border-collapse: collapse; margin-top: 0.6rem; table-layout: fixed; }
    .bl-table th, .bl-table td { padding: 0.42rem 0.9rem 0.36rem 0; text-align: left; vertical-align: baseline; }
    .bl-table th:last-child, .bl-table td:last-child { padding-right: 0; }
    .bl-table thead th {
      font-family: var(--font-type);
      font-weight: 400;
      font-size: 0.64rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--graphite-soft);
      border-bottom: 1px solid rgba(38, 40, 43, 0.4);
    }
    .bl-table col.c-no { width: 2.4em; }
    .bl-table col.c-pub { width: 4em; }
    .bl-table col.c-pct { width: 3.6em; }
    .bl-table col.c-mode { width: 3.8em; }
    .bl-table col.c-author { width: 34%; }

    .bl-table tbody td { border-bottom: 1px solid var(--graphite-faint); }
    .bl-table tr.bl-year th {
      padding: 1.1rem 0 0.25rem;
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 1.25rem;
      color: var(--graphite);
      border-bottom: 1px solid rgba(38, 40, 43, 0.4);
    }
    .bl-table tr.bl-year .typed { font-size: 0.62rem; margin-left: 0.7rem; }

    .bl-no, .bl-pub, .bl-pct, .bl-mode { font-family: var(--font-type); font-size: 0.72rem; color: var(--graphite-soft); white-space: nowrap; }
    .bl-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.02rem;
      line-height: 1.25;
      color: var(--graphite);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bl-author {
      font-family: var(--font-type);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: var(--graphite-soft);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bl-mode.ebook { color: var(--amethyst); }

    .bl-status { margin-top: 1.4rem; }
    .bl-foot { margin-top: 1.8rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: baseline; }

    /* ---------- footer (same as the homepage) ---------- */
    .sb-footer {
      border-top: 1px solid var(--hairline);
      padding: 2.4rem clamp(1rem, 5vw, 4rem) 2rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.8rem 3rem;
      font-family: var(--font-type);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--on-dark-dim);
    }
    .sb-footer > div { display: flex; flex-direction: column; gap: 0.45rem; }
    .sb-footer .links { text-align: right; }
    .sb-footer a { text-decoration: none; transition: color 0.3s ease; }
    .sb-footer a:hover { color: var(--on-dark); }

    /* ---------- small screens: each book becomes a card ---------- */
    @media (max-width: 719px) {
      .sb-header { flex-direction: column; gap: 0.7rem; }
      .sb-nav { justify-content: flex-start; gap: 0.6rem 1rem; }
      .bl-table thead { display: none; }
      .bl-table, .bl-table tbody { display: block; }
      .bl-table tr { display: grid; grid-template-columns: 2em auto auto auto 1fr; column-gap: 0.7rem; padding: 0.45rem 0; border-bottom: 1px solid var(--graphite-faint); }
      .bl-table tbody td { display: block; padding: 0; border: 0; }
      .bl-table tr.bl-year { display: block; border-bottom: 1px solid rgba(38, 40, 43, 0.4); padding: 0; }
      .bl-table tr.bl-year th { display: block; border: 0; }
      .bl-no { grid-row: 1 / 3; grid-column: 1; padding-top: 0.15rem !important; }
      .bl-title-cell { grid-column: 2 / -1; }
      .bl-author-cell { grid-column: 2 / -1; }
      .bl-pub { grid-column: 2; }
      .bl-pct { grid-column: 3; }
      .bl-mode { grid-column: 4; }
      .bl-title, .bl-author { white-space: normal; }
      .sb-footer { grid-template-columns: 1fr; }
      .sb-footer .links { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sb-fx .grain, .sb-fx .flicker { animation: none; }
    }
  </style>
</head>

<body>
  <div class="sb-fx" aria-hidden="true">
    <div class="grain"></div>
    <div class="flicker"></div>
    <div class="vignette"></div>
  </div>

  <header class="sb-header">
    <a class="sb-logo" href="index.html">perlgray</a>
    <nav class="sb-nav">
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="archive.html">Works</a>
      <a href="https://substack.com/@perlgray">Writing</a>
      <a href="booklog.html" aria-current="page">Booklog</a>
    </nav>
  </header>

  <main class="bl-desk">
    <article class="bl-sheet">
      <div class="bl-head">
        <div>
          <p class="typed">reading records — kept in pencil</p>
          <h1>booklog</h1>
        </div>
        <p class="typed" id="bl-summary"></p>
      </div>

      <table class="bl-table" id="bl-table" hidden>
        <colgroup><col class="c-no"><col class="c-title"><col class="c-author"><col class="c-pub"><col class="c-pct"><col class="c-mode"></colgroup>
        <thead><tr><th>no.</th><th>title</th><th>author</th><th>pub.</th><th>read</th><th>copy</th></tr></thead>
        <tbody id="bl-body"></tbody>
      </table>
      <p class="typed bl-status" id="bl-status">fetching records…</p>

      <div class="bl-foot">
        <p class="typed">— end of records —</p>
        <p class="note" style="--r:-1.5deg"><a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSxJBvFdixvcf-BeDk5gX8LPfbBX5XDm9pzoNbHQJRX9pIldt6BFnb7GUfh2AJdCqRWVj1IRHMACrYb/pubhtml" target="_blank" rel="noopener">see the full sheet →</a></p>
      </div>
    </article>
  </main>

  <footer class="sb-footer">
    <div>
      <span>jacqueline song</span>
      <span>artist &amp; creative technologist</span>
      <span>berkeley, ca | hong kong</span>
    </div>
    <div class="links">
      <a href="mailto:itsjacquelinehere@gmail.com">Email</a>
      <a href="https://www.instagram.com/perlgray/" target="_blank" rel="noopener">Gallery</a>
      <a href="https://www.linkedin.com/in/jacqueline-song">LinkedIn</a>
    </div>
  </footer>

  <script>
  (() => {
    // The page reads the published Google Sheet directly, so edits to the sheet appear here automatically.
    const CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxJBvFdixvcf-BeDk5gX8LPfbBX5XDm9pzoNbHQJRX9pIldt6BFnb7GUfh2AJdCqRWVj1IRHMACrYb/pub?gid=0&single=true&output=csv";
    const tableEl = document.getElementById("bl-table");
    const bodyEl = document.getElementById("bl-body");
    const statusEl = document.getElementById("bl-status");
    const summaryEl = document.getElementById("bl-summary");
    const pad = n => String(n).padStart(2, "0");

    function parseCSV(text) {
      const rows = [];
      let row = [], field = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (c === '"') q = false;
          else field += c;
        } else if (c === '"') q = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(field); rows.push(row); row = []; field = "";
        } else field += c;
      }
      if (field || row.length) { row.push(field); rows.push(row); }
      return rows.filter(r => r.some(v => v.trim()));
    }

    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };

    function render(rows) {
      const head = rows[0].map(h => h.trim().toLowerCase());
      const col = name => head.indexOf(name);
      const books = rows.slice(1).map(r => {
        const get = n => (col(n) >= 0 ? (r[col(n)] || "").trim() : "");
        const pct = parseFloat(get("progress"));
        return {
          title: get("title"),
          author: get("author").replace(/\s+,/g, ","),
          pub: get("published"),
          started: get("started") || "undated",
          pct: isNaN(pct) ? null : Math.max(0, Math.min(100, pct)),
          mode: get("mode").toLowerCase(),
        };
      }).filter(b => b.title);

      // group by the year each book was started, keeping the sheet's order
      const groups = new Map();
      books.forEach(b => { if (!groups.has(b.started)) groups.set(b.started, []); groups.get(b.started).push(b); });
      summaryEl.textContent = `${books.length} books`;

      let n = 0;
      groups.forEach((list, year) => {
        const yr = el("tr", "bl-year");
        const th = el("th", null, year);
        th.colSpan = 6;
        th.scope = "rowgroup";
        th.append(el("span", "typed", `${pad(list.length)}`));
        yr.append(th);
        bodyEl.append(yr);

        list.forEach(b => {
          n++;
          const tr = el("tr");
          tr.append(el("td", "bl-no", pad(n)));
          const t = el("td", "bl-title-cell");
          t.append(el("div", "bl-title", b.title));
          t.title = b.title;
          tr.append(t);
          const a = el("td", "bl-author-cell");
          a.append(el("div", "bl-author", b.author));
          a.title = b.author;
          tr.append(a);
          tr.append(el("td", "bl-pub", b.pub || "—"));
          tr.append(el("td", "bl-pct", b.pct == null ? "—" : Math.round(b.pct) + "%"));
          tr.append(el("td", "bl-mode" + (b.mode === "ebook" ? " ebook" : ""), b.mode || "—"));
          bodyEl.append(tr);
        });
      });

      tableEl.hidden = false;
      statusEl.hidden = true;
    }

    fetch(CSV)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(t => render(parseCSV(t)))
      .catch(() => {
        statusEl.textContent = "the records could not be fetched just now — open the full sheet below.";
      });
  })();
  </script>
</body>
</html>
